name: Daily US Market Cap Update

on:
  schedule:
    # 美股收盤後（美東時間 4PM = UTC 22:00），週一到週五
    - cron: '0 22 * * 1-5'
  workflow_dispatch:   # 允許手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas requests psycopg2-binary lxml html5lib

      - name: Fetch today's market cap data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python daily_fetch.py
