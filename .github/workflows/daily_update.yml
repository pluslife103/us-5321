name: Daily US Market Cap Update

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      force_refetch:
        description: '清空價格資料重抓（保留 shares 快取，較快）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      clear_shares:
        description: '同時清空 shares 快取（完整重置，第一次擴大股票池時用）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60        # full universe can take 20-40 min on first run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas requests psycopg2-binary lxml html5lib

      - name: Fetch market cap data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_REFETCH: ${{ github.event.inputs.force_refetch || 'false' }}
          CLEAR_SHARES:  ${{ github.event.inputs.clear_shares  || 'false' }}
        run: python daily_fetch.py
