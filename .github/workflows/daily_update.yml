name: Daily US Market Cap Update

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      force_refetch:
        description: '清空並重新抓取所有歷史資料（修正錯誤資料用）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60        # full universe can take 20-40 min on first run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas requests psycopg2-binary lxml html5lib

      - name: Fetch market cap data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_REFETCH: ${{ github.event.inputs.force_refetch || 'false' }}
        run: python daily_fetch.py
