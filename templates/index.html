<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美股市值篩選器</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242736;
    --border: #2e3148;
    --text: #e8eaf0;
    --text2: #9aa0b8;
    --accent: #4f7ef8;
    --accent2: #7c5cbf;
    --green: #22c55e;
    --red: #ef4444;
    --mega: #f59e0b;
    --large: #3b82f6;
    --mid: #8b5cf6;
    --small: #10b981;
    --micro: #6b7280;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header-left h1 span { color: var(--accent); }
  .header-meta {
    font-size: 0.78rem;
    color: var(--text2);
    margin-top: 2px;
  }
  .header-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .date-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .btn {
    padding: 7px 16px;
    border-radius: 6px;
    border: none;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Summary cards ── */
  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    padding: 20px 24px 0;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .card-label { font-size: 0.75rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
  .card-value { font-size: 1.4rem; font-weight: 700; margin-top: 4px; }
  .card-value.small-text { font-size: 1.1rem; }
  .card-sub { font-size: 0.75rem; color: var(--text2); margin-top: 2px; }
  .color-mega  { color: var(--mega); }
  .color-large { color: var(--large); }
  .color-mid   { color: var(--mid); }
  .color-small { color: var(--small); }
  .color-micro { color: var(--micro); }

  /* ── Filters ── */
  .filters {
    display: flex;
    gap: 10px;
    padding: 16px 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  .tier-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .tier-btn {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tier-btn:hover { color: var(--text); border-color: var(--accent); }
  .tier-btn.active { color: #fff; border-color: transparent; }
  .tier-btn[data-tier="all"].active    { background: var(--accent); }
  .tier-btn[data-tier="mega"].active   { background: var(--mega); }
  .tier-btn[data-tier="large"].active  { background: var(--large); }
  .tier-btn[data-tier="mid"].active    { background: var(--mid); }
  .tier-btn[data-tier="small"].active  { background: var(--small); }
  .tier-btn[data-tier="micro"].active  { background: var(--micro); }

  .filter-sep { width: 1px; height: 28px; background: var(--border); }
  .sector-select, .search-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.85rem;
  }
  .search-input { min-width: 200px; }
  .search-input::placeholder { color: var(--text2); }
  .search-input:focus, .sector-select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .result-count { margin-left: auto; font-size: 0.82rem; color: var(--text2); white-space: nowrap; }

  /* ── Table ── */
  .table-wrap {
    padding: 0 24px 32px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }
  thead { position: sticky; top: 61px; z-index: 10; }
  th {
    background: var(--surface);
    color: var(--text2);
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { color: var(--text); }
  th.sorted { color: var(--accent); }
  th .sort-icon { margin-left: 4px; opacity: 0.5; }
  th.sorted .sort-icon { opacity: 1; }
  td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  .col-rank { color: var(--text2); font-size: 0.8rem; width: 50px; }
  .col-ticker { font-weight: 700; color: var(--accent); letter-spacing: 0.3px; }
  .col-company { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .col-sector { color: var(--text2); font-size: 0.82rem; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
  .col-mcap { font-weight: 600; text-align: right; }
  .col-price { text-align: right; }
  .col-chg { text-align: right; font-weight: 600; }
  .up   { color: var(--green); }
  .down { color: var(--red); }

  /* ── Tier badge ── */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    border: 1px solid;
  }
  .badge-mega  { color: var(--mega);  border-color: var(--mega);  background: rgba(245,158,11,0.12); }
  .badge-large { color: var(--large); border-color: var(--large); background: rgba(59,130,246,0.12); }
  .badge-mid   { color: var(--mid);   border-color: var(--mid);   background: rgba(139,92,246,0.12); }
  .badge-small { color: var(--small); border-color: var(--small); background: rgba(16,185,129,0.12); }
  .badge-micro { color: var(--micro); border-color: var(--micro); background: rgba(107,114,128,0.12); }

  /* ── State messages ── */
  .state-msg {
    text-align: center;
    padding: 60px 24px;
    color: var(--text2);
  }
  .state-msg .icon { font-size: 2.5rem; margin-bottom: 12px; }
  .state-msg p { font-size: 0.95rem; }

  /* ── Crossover Stats Block ── */
  .crossover-stats {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px 12px;
    display: none;
    flex-direction: column;
    gap: 8px;
    position: sticky;
    top: 61px;
    z-index: 90;
  }
  .crossover-stats.visible { display: flex; }
  .stats-header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    cursor: pointer;
    user-select: none;
  }
  .stats-header:hover .stats-label { color: var(--text); }
  .stats-label { font-size: 0.82rem; color: var(--text2); font-weight: 700; transition: color 0.15s; }
  .stats-toggle-icon { font-size: 0.7rem; color: var(--text2); transition: transform 0.2s; margin-left: 2px; }
  .stats-toggle-icon.collapsed { transform: rotate(-90deg); }
  .stats-tabs { display: flex; gap: 3px; }
  .stats-tab {
    padding: 2px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .stats-tab.active { background: var(--green); border-color: var(--green); color: #fff; }
  .stats-nav {
    display: none;
    align-items: center;
    gap: 4px;
    margin-left: 4px;
  }
  .stats-nav.visible { display: flex; }
  .stats-nav-btn {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    font-size: 0.75rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    padding: 0;
  }
  .stats-nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .stats-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .stats-period-label { font-size: 0.78rem; color: var(--text); font-weight: 600; min-width: 100px; text-align: center; }
  .stats-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .stats-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px 4px 10px;
    border-radius: 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--text);
    font-weight: 500;
    cursor: default;
  }
  .stats-chip-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats-chip-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    padding: 1px 6px;
    border-radius: 10px;
    font-size: 0.72rem;
    font-weight: 800;
    color: #fff;
  }
  .stats-chip-count.tier-mega   { background: var(--mega);  }
  .stats-chip-count.tier-large  { background: var(--large); }
  .stats-chip-count.tier-mlarge { background: var(--mid);   }
  .stats-chip-count.tier-mid    { background: var(--small); }
  .stats-chip-count.tier-small  { background: var(--micro); }
  .stats-summary { font-size: 0.78rem; color: var(--text2); padding-top: 2px; }

  /* ── Crossover Alerts ── */
  .crossover-bar {
    margin: 16px 24px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .crossover-bar-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    cursor: pointer;
    user-select: none;
  }
  .crossover-bar-header:hover { background: var(--surface2); }
  .crossover-bar-icon { font-size: 1rem; }
  .crossover-bar-title { font-size: 0.85rem; font-weight: 700; color: var(--text); flex: 1; }
  .crossover-bar-date { font-size: 0.78rem; color: var(--text2); }
  .crossover-bar-count {
    font-size: 0.75rem; font-weight: 700;
    padding: 2px 8px; border-radius: 10px;
    background: rgba(245,158,11,0.15); color: var(--mega);
    border: 1px solid rgba(245,158,11,0.3);
  }
  .crossover-chevron { font-size: 0.75rem; color: var(--text2); transition: transform 0.2s; }
  .crossover-chevron.open { transform: rotate(180deg); }
  .crossover-list {
    display: none;
    padding: 0 12px 12px;
    gap: 8px;
    flex-direction: column;
  }
  .crossover-list.open { display: flex; }
  .crossover-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .crossover-card.tier-mega   { border-left: 3px solid var(--mega); }
  .crossover-card.tier-large  { border-left: 3px solid var(--large); }
  .crossover-card.tier-mlarge { border-left: 3px solid var(--mid); }
  .crossover-card.tier-mid    { border-left: 3px solid var(--small); }
  .crossover-card.tier-small  { border-left: 3px solid var(--micro); }
  .crossover-tier-badge {
    font-size: 0.7rem; font-weight: 700;
    padding: 2px 7px; border-radius: 8px;
    white-space: nowrap;
  }
  .tier-badge-mega   { background: rgba(245,158,11,0.15); color: var(--mega);  border: 1px solid rgba(245,158,11,0.3); }
  .tier-badge-large  { background: rgba(59,130,246,0.15);  color: var(--large); border: 1px solid rgba(59,130,246,0.3); }
  .tier-badge-mlarge { background: rgba(139,92,246,0.15);  color: var(--mid);   border: 1px solid rgba(139,92,246,0.3); }
  .tier-badge-mid    { background: rgba(16,185,129,0.15);  color: var(--small); border: 1px solid rgba(16,185,129,0.3); }
  .tier-badge-small  { background: rgba(107,114,128,0.15); color: var(--micro); border: 1px solid rgba(107,114,128,0.3); }
  .crossover-arrow { font-size: 1.1rem; }
  .crossover-stocks { flex: 1; }
  .crossover-main { font-size: 0.88rem; font-weight: 600; color: var(--text); }
  .crossover-main .winner { color: var(--green); }
  .crossover-main .loser  { color: var(--red); }
  .crossover-caps { font-size: 0.78rem; color: var(--text2); margin-top: 3px; }
  .crossover-caps .cap-up   { color: var(--green); font-weight: 600; }
  .crossover-caps .cap-down { color: var(--red);   font-weight: 600; }
  .crossover-losers { display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
  .loser-item { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
  .crossover-empty { padding: 12px 16px; font-size: 0.83rem; color: var(--text2); }

  /* ── Compare Section ── */
  .compare-section {
    margin: 20px 24px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px 20px;
  }
  .compare-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .compare-title {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .compare-search-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .compare-search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }
  .compare-search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text2);
    font-size: 0.9rem;
    pointer-events: none;
  }
  .compare-search {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px 8px 34px;
    border-radius: 8px;
    font-size: 0.88rem;
  }
  .compare-search:focus { outline: none; border-color: var(--accent); }
  .compare-search::placeholder { color: var(--text2); }
  .compare-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 50;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .compare-dropdown.open { display: block; }
  .compare-option {
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.83rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .compare-option:hover { background: var(--surface); }
  .compare-option .opt-ticker { font-weight: 700; color: var(--accent); min-width: 56px; }
  .compare-option .opt-name   { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .compare-option .opt-cap    { color: var(--text2); font-size: 0.75rem; white-space: nowrap; }

  /* Controls row */
  .compare-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .compare-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
    min-height: 30px;
    align-items: center;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px 4px 10px;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: default;
  }
  .chip-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .chip-remove {
    cursor: pointer;
    opacity: 0.55;
    font-size: 1rem;
    line-height: 1;
    margin-left: 2px;
  }
  .chip-remove:hover { opacity: 1; }

  .period-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .metric-btn {
    padding: 5px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .metric-btn.active { background: var(--green); border-color: var(--green); color: #fff; }
  .compare-clear {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .compare-clear:hover { border-color: var(--red); color: var(--red); }

  .compare-chart-wrap { position: relative; height: 280px; }
  .compare-empty {
    height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text2);
    font-size: 0.88rem;
    gap: 10px;
  }
  .compare-empty-icon { font-size: 2.2rem; opacity: 0.35; }

  /* ── Charts ── */
  .charts-section {
    padding: 20px 24px 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 900px) { .charts-section { grid-template-columns: 1fr; } }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .chart-title { font-size: 0.85rem; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.4px; }
  .chart-tabs { display: flex; gap: 4px; }
  .chart-tab {
    padding: 3px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .chart-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chart-wrap { position: relative; height: 260px; }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 0.88rem;
    max-width: 340px;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.25s;
    z-index: 200;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>美股市值篩選器 <span>US Market Cap</span></h1>
    <div class="header-meta" id="headerMeta">載入中…</div>
  </div>
  <div class="header-right">
    <select class="date-select" id="dateSelect"></select>
    <button class="btn btn-primary" id="refreshBtn" onclick="refresh()">更新資料</button>
  </div>
</header>

<!-- ── Crossover Stats Bar ── -->
<div class="crossover-stats" id="crossoverStats">
  <div class="stats-header" onclick="toggleStatsBody()">
    <span class="stats-label">🔔 異動統計</span>
    <span class="stats-toggle-icon" id="statsToggleIcon">▼</span>
    <div class="stats-tabs" onclick="event.stopPropagation()">
      <button class="stats-tab active" data-period="day"   onclick="setStatsPeriod('day',this)">當日</button>
      <button class="stats-tab"        data-period="week"  onclick="setStatsPeriod('week',this)">本週</button>
      <button class="stats-tab"        data-period="month" onclick="setStatsPeriod('month',this)">本月</button>
    </div>
    <div class="stats-nav" id="statsNav">
      <button class="stats-nav-btn" id="statsPrev" onclick="shiftStatsPeriod(-1)">◀</button>
      <span class="stats-period-label" id="statsPeriodLabel"></span>

        <th onclick="sortBy('sector')">產業 <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('market_cap')" class="col-mcap sorted">市值 (USD) <span class="sort-icon">↓</span></th>
        <th>分類</th>
        <th onclick="sortBy('price')" class="col-price">股價 <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('change_pct')" class="col-chg">漲跌% <span class="sort-icon">↕</span></th>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let allRows = [];
let activeTier = 'all';
let sortKey = 'market_cap';
let sortDir = -1; // -1 = desc, 1 = asc
const TIERS = {
  mega:  r => r.market_cap >= 200e9,
  large: r => r.market_cap >= 10e9  && r.market_cap < 200e9,
  mid:   r => r.market_cap >= 2e9   && r.market_cap < 10e9,
  small: r => r.market_cap >= 300e6 && r.market_cap < 2e9,
  micro: r => r.market_cap > 0      && r.market_cap < 300e6,
};
function tierOf(cap) {
  if (cap >= 200e9) return 'mega';
  if (cap >= 10e9)  return 'large';
  if (cap >= 2e9)   return 'mid';
  if (cap >= 300e6) return 'small';
  return 'micro';
}

// ── Number formatting ──────────────────────────────────────────────────────
function fmtCap(v) {
  if (!v || v <= 0) return '—';
  if (v >= 1e12)  return '$' + (v / 1e12).toFixed(2) + 'T';
  if (v >= 1e9)   return '$' + (v / 1e9).toFixed(1) + 'B';
  if (v >= 1e6)   return '$' + (v / 1e6).toFixed(0) + 'M';
  return '$' + v.toFixed(0);
}
function fmtPrice(v) {
  if (!v || v <= 0) return '—';
  return '$' + v.toFixed(2);
}
function fmtPct(v) {
  if (v === null || v === undefined) return '—';
  const sign = v > 0 ? '+' : '';
  return sign + v.toFixed(2) + '%';
}

// ── Badge ──────────────────────────────────────────────────────────────────
const TIER_LABELS = { mega: 'Mega', large: 'Large', mid: 'Mid', small: 'Small', micro: 'Micro' };
function badge(cap) {
  const t = tierOf(cap);
  return `<span class="badge badge-${t}">${TIER_LABELS[t]}</span>`;
}

// ── Render ─────────────────────────────────────────────────────────────────
function applyFilters() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const sector = document.getElementById('sectorSelect').value;

  let rows = allRows;
  if (activeTier !== 'all') rows = rows.filter(TIERS[activeTier]);
  if (sector) rows = rows.filter(r => r.sector === sector);
  if (search) rows = rows.filter(r =>
    r.ticker.toLowerCase().includes(search) ||
    r.company_name.toLowerCase().includes(search)
  );

  // Sort
  rows = [...rows].sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (va < vb) return -sortDir;
    if (va > vb) return sortDir;
    return 0;
  });

  document.getElementById('resultCount').textContent = `顯示 ${rows.length} 檔`;
  renderRows(rows);
  renderCharts();
}

function renderRows(rows) {
  const tbody = document.getElementById('tbody');
  const msg = document.getElementById('stateMsg');

  if (!rows.length) {
    tbody.innerHTML = '';
    msg.style.display = 'block';
    document.getElementById('stateMsgText').textContent = '沒有符合條件的股票';
    return;
  }
  msg.style.display = 'none';

  // Recompute rank in filtered list
  tbody.innerHTML = rows.map((r, i) => {
    const chgClass = r.change_pct > 0 ? 'up' : r.change_pct < 0 ? 'down' : '';
    return `<tr>
      <td class="col-rank">${i + 1}</td>
      <td class="col-ticker">${r.ticker}</td>
      <td class="col-company" title="${r.company_name}">${r.company_name}</td>
      <td class="col-sector"  title="${r.sector}">${r.sector || '—'}</td>
      <td class="col-mcap">${fmtCap(r.market_cap)}</td>
      <td>${badge(r.market_cap)}</td>
      <td class="col-price">${fmtPrice(r.price)}</td>
      <td class="col-chg ${chgClass}">${fmtPct(r.change_pct)}</td>
    </tr>`;
  }).join('');
}

// ── Sort ───────────────────────────────────────────────────────────────────
function sortBy(key) {
  if (sortKey === key) {
    sortDir *= -1;
  } else {
    sortKey = key;
    sortDir = key === 'market_cap' || key === 'price' || key === 'change_pct' ? -1 : 1;
  }
  // Update header UI
  document.querySelectorAll('th').forEach(th => {
    th.classList.remove('sorted');
    const icon = th.querySelector('.sort-icon');
    if (icon) icon.textContent = '↕';
  });
  const activeTh = [...document.querySelectorAll('th')].find(
    th => th.getAttribute('onclick') === `sortBy('${key}')`
  );
  if (activeTh) {
    activeTh.classList.add('sorted');
    const icon = activeTh.querySelector('.sort-icon');
    if (icon) icon.textContent = sortDir === -1 ? '↓' : '↑';
  }
  applyFilters();
}

// ── Tier filter ────────────────────────────────────────────────────────────
function setTier(tier) {
  activeTier = tier;
  document.querySelectorAll('.tier-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tier === tier);
  });
  applyFilters();
}

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg, duration = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

// ── Load data ──────────────────────────────────────────────────────────────
async function loadData(dateStr) {
  const msg = document.getElementById('stateMsg');
  const msgTxt = document.getElementById('stateMsgText');
  msg.style.display = 'block';
  msgTxt.textContent = '資料載入中…';
  document.getElementById('tbody').innerHTML = '';

  try {
    const url = dateStr ? `/api/stocks?date=${dateStr}` : '/api/stocks';
    const res = await fetch(url);
    if (!res.ok) {
      const err = await res.json();
      msgTxt.textContent = err.error || '載入失敗';
      return;
    }
    const { date, summary, data } = await res.json();
    allRows = data;

    // Header meta
    document.getElementById('headerMeta').textContent =
      `資料日期：${date}　共 ${summary.total} 檔　S&P 500`;

    // Summary cards
    document.getElementById('s-total').textContent = summary.total;
    document.getElementById('s-totalcap').textContent = fmtCap(summary.total_cap);
    document.getElementById('s-mega').textContent  = summary.mega;
    document.getElementById('s-large').textContent = summary.large;
    document.getElementById('s-mid').textContent   = summary.mid;
    document.getElementById('s-small').textContent = summary.small;
    document.getElementById('s-micro').textContent = summary.micro;

    // Sectors
    const sectorSel = document.getElementById('sectorSelect');
    const currentSector = sectorSel.value;
    const sectors = [...new Set(data.map(r => r.sector).filter(Boolean))].sort();
    sectorSel.innerHTML = '<option value="">所有產業</option>' +
      sectors.map(s => `<option value="${s}"${s === currentSector ? ' selected' : ''}>${s}</option>`).join('');

    msg.style.display = 'none';
    applyFilters();
    loadCrossovers(date);
  } catch (e) {
    msgTxt.textContent = `錯誤：${e.message}`;
  }
}

async function loadDates() {
  const res = await fetch('/api/dates');
  const dates = await res.json();
  const sel = document.getElementById('dateSelect');
  sel.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');
  sel.onchange = () => loadData(sel.value);
}

// ── Refresh ────────────────────────────────────────────────────────────────
async function refresh() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = '更新中…';
  try {
    const res = await fetch('/api/refresh', { method: 'POST' });
    const data = await res.json();
    toast(data.message, 5000);
    // Poll for new data after 90s
    setTimeout(async () => {
      await loadDates();
      await loadData(document.getElementById('dateSelect').value);
      btn.disabled = false;
      btn.textContent = '更新資料';
    }, 90000);
  } catch (e) {
    toast('更新失敗：' + e.message);
    btn.disabled = false;
    btn.textContent = '更新資料';
  }
}

// ── Crossover Alerts ─────────────────────────────────────────────────────
let crossoverOpen  = true;
let statsPeriod    = 'day';
let currentDateStr = '';

function toggleCrossovers() {
  crossoverOpen = !crossoverOpen;
  document.getElementById('crossoverList').classList.toggle('open', crossoverOpen);
  document.getElementById('crossoverChevron').classList.toggle('open', crossoverOpen);
}

async function setStatsPeriod(period, btn) {
  statsPeriod  = period;
  statsRefDate = currentDateStr;
  document.querySelectorAll('.stats-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadStatsPills();
}

let statsBodyOpen = true;

function toggleStatsBody() {
  statsBodyOpen = !statsBodyOpen;
  const body = document.getElementById('statsBody');
  const icon = document.getElementById('statsToggleIcon');
  body.style.display = statsBodyOpen ? '' : 'none';
  icon.classList.toggle('collapsed', !statsBodyOpen);
}

// statsRefDate: the anchor date used for week/month navigation
let statsRefDate = '';

function shiftStatsPeriod(dir) {
  if (statsPeriod === 'week') {
    const base = statsRefDate || currentDateStr;
    const d = new Date(base + 'T00:00:00');
    d.setDate(d.getDate() + dir * 7);
    statsRefDate = d.toISOString().slice(0, 10);
  } else if (statsPeriod === 'month') {
    const base = statsRefDate || currentDateStr;
    const [y, m] = base.slice(0, 7).split('-').map(Number);
    const nd = new Date(y, m - 1 + dir, 1);
    statsRefDate = `${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}-15`;
  }
  loadStatsPills();
}

function renderStatsPills(result) {
  const { meta, items } = result;
  const container = document.getElementById('statsPills');
  const summary   = document.getElementById('statsSummary');
  const periodLbl = document.getElementById('statsPeriodLabel');
  const nav       = document.getElementById('statsNav');
  const prevBtn   = document.getElementById('statsPrev');
  const nextBtn   = document.getElementById('statsNext');

  if (statsPeriod === 'week') {
    nav.classList.add('visible');
    const fmt = s => s ? s.slice(5).replace('-', '/') : '';
    periodLbl.textContent = (meta && meta.start) ? `${fmt(meta.start)} – ${fmt(meta.end)}` : '';
    const refD = new Date((statsRefDate || currentDateStr) + 'T00:00:00');
    const curD = new Date(currentDateStr + 'T00:00:00');
    const refMon = new Date(refD); refMon.setDate(refD.getDate() - refD.getDay() + (refD.getDay() === 0 ? -6 : 1));
    const curMon = new Date(curD); curMon.setDate(curD.getDate() - curD.getDay() + (curD.getDay() === 0 ? -6 : 1));
    nextBtn.disabled = refMon >= curMon;
  } else if (statsPeriod === 'month') {
    nav.classList.add('visible');
    periodLbl.textContent = (meta && meta.ym) || (statsRefDate || currentDateStr).slice(0, 7);
    const refYM = (statsRefDate || currentDateStr).slice(0, 7);
    const curYM = currentDateStr.slice(0, 7);
    nextBtn.disabled = refYM >= curYM;
  } else {
    nav.classList.remove('visible');
    periodLbl.textContent = currentDateStr;
  }

  if (!items || !items.length) {
    container.innerHTML = '<span style="color:var(--text2);font-size:0.78rem">本期無超越事件</span>';
    summary.textContent = '';
    return;
  }

  container.innerHTML = items.map(item =>
    `<span class="stats-chip">
       <span class="stats-chip-name">${item.winner} ${item.winner_name}</span>
       <span class="stats-chip-count tier-${item.tier}">${item.count}次</span>
     </span>`
  ).join('');

  const totalEvents    = items.reduce((s, i) => s + i.count, 0);
  const totalCompanies = items.length;
  summary.textContent  = `共 ${totalEvents} 次超越事件，${totalCompanies} 間公司曾超越他人`;
}

async function loadStatsPills() {
  const statsEl = document.getElementById('crossoverStats');
  const ref = statsRefDate || currentDateStr;
  try {
    const qs = `period=${statsPeriod}${ref ? '&ref_date=' + ref : ''}`;
    const result = await fetch(`/api/crossover-stats?${qs}`).then(r => r.json());
    statsEl.classList.add('visible');
    renderStatsPills(result);
  } catch(e) {
    statsEl.classList.remove('visible');
  }
}

async function loadCrossovers(dateStr) {
  currentDateStr = dateStr || '';
  statsRefDate   = currentDateStr;
  const bar   = document.getElementById('crossoverBar');
  const stats = document.getElementById('crossoverStats');

  loadStatsPills();

  try {
    const url = dateStr ? `/api/crossovers?date=${dateStr}` : '/api/crossovers';
    const events = await fetch(url).then(r => r.json());

    if (!events.length) { bar.style.display = 'none'; return; }

    bar.style.display = 'block';
    document.getElementById('crossoverDate').textContent = dateStr || '';

    // Group by winner
    const grouped = {};
    events.forEach(e => {
      const key = e.winner;
      if (!grouped[key]) grouped[key] = { ...e, losers: [] };
      grouped[key].losers.push(e);
    });
    const cards = Object.values(grouped).sort((a, b) => b.winner_cap - a.winner_cap);

    const TIER_LABELS = {
      mega: 'Mega ≥$200B', large: '$100B–$200B',
      mlarge: '$10B–$100B', mid: '$2B–$10B', small: '$300M–$2B',
    };
    const tierOrder = ['mega','large','mlarge','mid','small'];
    const parts = tierOrder
      .map(t => ({ t, n: cards.filter(c => c.tier === t).length }))
      .filter(x => x.n > 0)
      .map(x => `${TIER_LABELS[x.t]} ${x.n} 筆`);
    document.getElementById('crossoverCount').textContent = parts.join('　');

    document.getElementById('crossoverList').innerHTML = cards.map(c => {
      const TIER_META = {
        mega:   { badge: 'Mega ≥$200B',     color: 'var(--mega)'  },
        large:  { badge: '$100B–$200B',      color: 'var(--large)' },
        mlarge: { badge: '$10B–$100B',       color: 'var(--mid)'   },
        mid:    { badge: '$2B–$10B',         color: 'var(--small)' },
        small:  { badge: '$300M–$2B',        color: 'var(--micro)' },
      };
      const tm         = TIER_META[c.tier] || TIER_META.small;
      const badgeClass = `tier-badge-${c.tier}`;
      const badgeText  = tm.badge;
      const arrowColor = tm.color;

      const losersHtml = c.losers.map(e =>
        `<span class="loser-item">
          <span class="loser">${e.loser} ${e.loser_name}</span>
          <span class="crossover-caps">
            今日 <span class="cap-up">${fmtCap(e.winner_cap)}</span> > <span class="cap-down">${fmtCap(e.loser_cap)}</span>
            &emsp;昨日 ${fmtCap(e.winner_prev_cap)} < ${fmtCap(e.loser_prev_cap)}
          </span>
        </span>`
      ).join('');

      return `
      <div class="crossover-card tier-${c.tier}">
        <span class="crossover-arrow" style="color:${arrowColor}">📈</span>
        <div class="crossover-stocks">
          <div class="crossover-main">
            <span class="winner">${c.winner} ${c.winner_name}</span>
            &nbsp;超越&nbsp;
          </div>
          <div class="crossover-losers">${losersHtml}</div>
        </div>
        <span class="crossover-tier-badge ${badgeClass}">${badgeText}</span>
      </div>`;
    }).join('');
  } catch(err) {
    bar.style.display = 'none';
  }
}

// ── Compare (Market Cap Growth) ────────────────────────────────────────────
const CHIP_COLORS = ['#22c55e','#f97316','#4f7ef8','#f59e0b','#8b5cf6','#06b6d4','#ef4444','#e879f9'];
let compareList    = [];   // [{ticker, company_name}]
let compareHistory = {};   // { ticker: [{date, market_cap}] }
let growthMode     = 'abs';
let comparePeriod  = 30;
let compareChartInst = null;

function setGrowthMode(mode, btn) {
  growthMode = mode;
  document.querySelectorAll('.metric-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCompareChart();
}

function onPeriodChange() {
  comparePeriod = parseInt(document.getElementById('periodSelect').value);
  renderCompareChart();
}

function clearCompare() {
  compareList = []; compareHistory = {};
  renderChips(); renderCompareChart();
}

function addToCompare(row) {
  if (compareList.find(r => r.ticker === row.ticker)) return;
  if (compareList.length >= 8) { toast('最多比較 8 支股票'); return; }
  compareList.push({ ticker: row.ticker, company_name: row.company_name });
  renderChips();
  document.getElementById('compareSearch').value = '';
  document.getElementById('compareDropdown').classList.remove('open');
  loadCompareHistory();
}

function removeFromCompare(ticker) {
  compareList = compareList.filter(r => r.ticker !== ticker);
  delete compareHistory[ticker];
  renderChips(); renderCompareChart();
}

function renderChips() {
  const wrap = document.getElementById('compareChips');
  const hint = document.getElementById('compareHint');
  if (!compareList.length) {
    wrap.innerHTML = ''; wrap.appendChild(hint); hint.style.display = ''; return;
  }
  hint.style.display = 'none';
  wrap.innerHTML = compareList.map((r, i) => {
    const c = CHIP_COLORS[i % CHIP_COLORS.length];
    return `<span class="chip" style="background:${c}28;color:${c}">
      <span class="chip-dot" style="background:${c}"></span>
      ${r.ticker} ${r.company_name}
      <span class="chip-remove" onclick="removeFromCompare('${r.ticker}')">×</span>
    </span>`;
  }).join('');
  wrap.appendChild(hint);
}

async function loadCompareHistory() {
  if (!compareList.length) { renderCompareChart(); return; }
  const tickers = compareList.map(r => r.ticker).join(',');
  try {
    const rows = await fetch(`/api/history?tickers=${tickers}`).then(r => r.json());
    compareHistory = {};
    rows.forEach(r => {
      (compareHistory[r.ticker] = compareHistory[r.ticker] || []).push(
        { date: r.date, market_cap: r.market_cap }
      );
    });
    renderCompareChart();
  } catch(e) { toast('歷史資料載入失敗'); }
}

function buildDateAxis(days) {
  const today = new Date();
  const dates = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    dates.push(d.toISOString().slice(0, 10));
  }
  return dates;
}

function renderCompareChart() {
  const empty = document.getElementById('compareEmpty');
  const wrap  = document.getElementById('compareChartWrap');

  if (!compareList.length) {
    empty.style.display = 'flex'; wrap.style.display = 'none';
    if (compareChartInst) { compareChartInst.destroy(); compareChartInst = null; }
    return;
  }

  const allDates = buildDateAxis(comparePeriod);
  empty.style.display = 'none'; wrap.style.display = 'block';

  const datasets = compareList.map((stock, i) => {
    const hist   = compareHistory[stock.ticker] || [];
    const byDate = Object.fromEntries(hist.map(r => [r.date, r.market_cap]));
    const color  = CHIP_COLORS[i % CHIP_COLORS.length];

    let values = allDates.map(d => byDate[d] != null ? byDate[d] / 1e9 : null);

    if (growthMode === 'norm') {
      const first = values.find(v => v != null);
      values = values.map(v => v != null && first ? +((v / first - 1) * 100).toFixed(2) : null);
    } else {
      values = values.map(v => v != null ? +v.toFixed(2) : null);
    }

    return {
      label: `${stock.ticker} ${stock.company_name}`,
      data: values,
      borderColor: color,
      backgroundColor: color + '18',
      borderWidth: 2,
      pointRadius: comparePeriod <= 14 ? 4 : comparePeriod <= 30 ? 3 : 2,
      pointHoverRadius: 6,
      pointBackgroundColor: color,
      tension: 0.35,
      fill: true,
      spanGaps: true,
    };
  });

  const isNorm = growthMode === 'norm';
  const fmtY   = isNorm
    ? v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%'
    : v => '$' + (v >= 1000 ? (v/1000).toFixed(2)+'T' : v.toFixed(0)+'B');

  if (compareChartInst) compareChartInst.destroy();
  compareChartInst = new Chart(document.getElementById('compareChart'), {
    type: 'line',
    data: { labels: allDates, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      animation: { duration: 350 },
      plugins: {
        legend: {
          display: true,
          position: 'top',
          align: 'center',
          labels: {
            color: '#e8eaf0',
            font: { size: 12, weight: '600' },
            boxWidth: 12, boxHeight: 12,
            padding: 20,
            usePointStyle: true,
            pointStyle: 'circle',
          },
        },
        tooltip: {
          backgroundColor: '#1a1d27',
          borderColor: '#2e3148',
          borderWidth: 1,
          padding: 10,
          callbacks: {
            label: ctx => {
              if (ctx.parsed.y == null) return null;
              return `  ${ctx.dataset.label}: ${fmtY(ctx.parsed.y)}`;
            },
          },
        },
      },
      scales: {
        x: {
          ticks: {
            color: '#9aa0b8',
            maxTicksLimit: comparePeriod <= 14 ? comparePeriod : 10,
            maxRotation: 0,
            autoSkip: true,
          },
          grid: { color: '#2e314840' },
        },
        y: {
          ticks: { color: '#9aa0b8', callback: fmtY },
          grid:  { color: '#2e314880' },
        },
      },
    },
  });
}

// ── Search autocomplete ────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const inp  = document.getElementById('compareSearch');
  const drop = document.getElementById('compareDropdown');

  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    if (!q || !allRows.length) { drop.classList.remove('open'); return; }
    const hits = allRows
      .filter(r => r.ticker.toLowerCase().includes(q) || r.company_name.toLowerCase().includes(q))
      .slice(0, 8);
    if (!hits.length) { drop.classList.remove('open'); return; }
    drop.innerHTML = hits.map(r => `
      <div class="compare-option" onclick='addToCompare(${JSON.stringify({ticker:r.ticker,company_name:r.company_name})})'>
        <span class="opt-ticker">${r.ticker}</span>
        <span class="opt-name">${r.company_name}</span>
        <span class="opt-cap">${fmtCap(r.market_cap)}</span>
      </div>`).join('');
    drop.classList.add('open');
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.compare-search-wrap')) drop.classList.remove('open');
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Escape') drop.classList.remove('open'); });
});

// ── Charts ────────────────────────────────────────────────────────────────
let barN = 10;
let donutMode = 'tier';
let barChartInst = null;
let donutChartInst = null;

const CHART_DEFAULTS = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: { legend: { display: false } },
  animation: { duration: 400 },
};

function chartColors(n) {
  const palette = ['#4f7ef8','#f59e0b','#8b5cf6','#10b981','#ef4444','#06b6d4','#f97316','#a855f7','#22c55e','#e879f9',
                   '#3b82f6','#facc15','#7c3aed','#34d399','#fb7185','#38bdf8','#fb923c','#c084fc','#4ade80','#f472b6'];
  return Array.from({length: n}, (_, i) => palette[i % palette.length]);
}

function setBarN(n, btn) {
  barN = n;
  document.querySelectorAll('#barChart').forEach(() => {});
  btn.closest('.chart-tabs').querySelectorAll('.chart-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCharts();
}

function setDonut(mode, btn) {
  donutMode = mode;
  btn.closest('.chart-tabs').querySelectorAll('.chart-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCharts();
}

function getVisibleRows() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const sector = document.getElementById('sectorSelect').value;
  let rows = allRows;
  if (activeTier !== 'all') rows = rows.filter(TIERS[activeTier]);
  if (sector) rows = rows.filter(r => r.sector === sector);
  if (search) rows = rows.filter(r =>
    r.ticker.toLowerCase().includes(search) || r.company_name.toLowerCase().includes(search)
  );
  return rows;
}

function renderBarChart(rows) {
  const top = [...rows].sort((a, b) => b.market_cap - a.market_cap).slice(0, barN);
  const labels = top.map(r => r.ticker);
  const data   = top.map(r => +(r.market_cap / 1e9).toFixed(1));
  const colors = top.map(r => {
    const t = tierOf(r.market_cap);
    return { mega:'#f59e0b', large:'#3b82f6', mid:'#8b5cf6', small:'#10b981', micro:'#6b7280' }[t];
  });

  if (barChartInst) barChartInst.destroy();
  barChartInst = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 4, borderSkipped: false }] },
    options: {
      ...CHART_DEFAULTS,
      indexAxis: 'y',
      scales: {
        x: { ticks: { color: '#9aa0b8', callback: v => '$' + v + 'B' }, grid: { color: '#2e3148' } },
        y: { ticks: { color: '#e8eaf0', font: { weight: '600' } }, grid: { display: false } },
      },
      plugins: {
        ...CHART_DEFAULTS.plugins,
        tooltip: { callbacks: { label: ctx => ' $' + ctx.parsed.x.toFixed(1) + 'B' } },
      },
    },
  });
}

function renderDonutChart(rows) {
  let labels, data, colors;

  if (donutMode === 'tier') {
    const counts = { Mega: 0, Large: 0, Mid: 0, Small: 0, Micro: 0 };
    rows.forEach(r => {
      const t = tierOf(r.market_cap);
      counts[t.charAt(0).toUpperCase() + t.slice(1)]++;
    });
    labels = Object.keys(counts).filter(k => counts[k] > 0);
    data   = labels.map(k => counts[k]);
    colors = labels.map(k => ({ Mega:'#f59e0b', Large:'#3b82f6', Mid:'#8b5cf6', Small:'#10b981', Micro:'#6b7280' }[k]));

  } else if (donutMode === 'sector') {
    const counts = {};
    rows.forEach(r => { const s = r.sector || 'Other'; counts[s] = (counts[s] || 0) + 1; });
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 10);
    labels = sorted.map(([k]) => k);
    data   = sorted.map(([, v]) => v);
    colors = chartColors(labels.length);

  } else {
    const up   = rows.filter(r => r.change_pct > 0).length;
    const down = rows.filter(r => r.change_pct < 0).length;
    const flat = rows.filter(r => r.change_pct === 0).length;
    labels = ['上漲', '下跌', '持平'];
    data   = [up, down, flat];
    colors = ['#22c55e', '#ef4444', '#6b7280'];
  }

  if (donutChartInst) donutChartInst.destroy();
  donutChartInst = new Chart(document.getElementById('donutChart'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#1a1d27', hoverOffset: 8 }] },
    options: {
      ...CHART_DEFAULTS,
      cutout: '62%',
      plugins: {
        legend: {
          display: true,
          position: 'right',
          labels: { color: '#9aa0b8', font: { size: 11 }, boxWidth: 12, padding: 8 },
        },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed}` } },
      },
    },
  });
}

function renderCharts() {
  const rows = getVisibleRows();
  if (!rows.length) return;
  renderBarChart(rows);
  renderDonutChart(rows);
}

// ── Init ───────────────────────────────────────────────────────────────────
(async () => {
  await loadDates();
  const dateVal = document.getElementById('dateSelect').value;
  // Load stats bar independently so it shows even if main data has issues
  currentDateStr = dateVal || '';
  statsRefDate   = currentDateStr;
  loadStatsPills();          // non-blocking, runs in parallel
  await loadData(dateVal);
})();
</script>
